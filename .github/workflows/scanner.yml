name: Sector Scanner

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 21:15 UTC, shortly after the US market close
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run scanner
        run: python sector_scanner.py

      - name: Publish table to job summary
        run: cat sector_table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_table.md
          if ! git diff --cached --quiet; then
            git commit -m "Update sector performance table"
            git push
          fi
